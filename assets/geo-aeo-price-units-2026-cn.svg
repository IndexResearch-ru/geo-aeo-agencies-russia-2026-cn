<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" role="img"><title>59 条价格及服务观察的计费单位</title><rect width="1080" height="350" fill="#f6f9fb"/><text x="35" y="58" font-size="30" fill="#0e3455" font-family="Arial" font-weight="bold">59 条价格及服务观察</text><text x="38" y="130" font-family="Arial" font-size="23" fill="#0e3455">明确标为月费</text><rect x="308" y="108" rx="5" width="540" height="31" fill="#0e3455"/><text x="866" y="131" font-family="Arial" font-size="23" fill="#0e3455">30</text><text x="38" y="205" font-family="Arial" font-size="23" fill="#0e3455">收费周期未标明</text><rect x="308" y="183" rx="5" width="360" height="31" fill="#6e91aa"/><text x="686" y="206" font-family="Arial" font-size="23" fill="#0e3455">20</text><text x="38" y="280" font-family="Arial" font-size="23" fill="#0e3455">其他计费方式</text><rect x="308" y="258" rx="5" width="162" height="31" fill="#b1c3d1"/><text x="488" y="281" font-family="Arial" font-size="23" fill="#0e3455">9</text><text x="38" y="340" font-family="Arial" font-size="16" fill="#4b647a">观察条目不等于独立公司或不同套餐</text></svg>