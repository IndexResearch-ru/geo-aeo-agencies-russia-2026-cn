<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img"><title>核实 GEO/AEO 套餐的实际工作范围</title><rect width="1200" height="350" fill="#f6f9fb"/><text x="36" y="56" font-family="Arial" font-size="29" fill="#0e3455" font-weight="bold">核实 GEO/AEO 套餐的实际工作范围</text><rect x="30" y="108" width="270" height="135" rx="12" fill="white" stroke="#c1d0dc"/><text x="43" y="155" font-family="Arial" font-size="22" fill="#0e3455" font-weight="bold">网站</text><text x="43" y="197" font-family="Arial" font-size="18" fill="#4e667c">修改或任务说明</text><rect x="320" y="108" width="270" height="135" rx="12" fill="white" stroke="#c1d0dc"/><text x="333" y="155" font-family="Arial" font-size="22" fill="#0e3455" font-weight="bold">内容</text><text x="333" y="197" font-family="Arial" font-size="18" fill="#4e667c">由谁撰写</text><rect x="610" y="108" width="270" height="135" rx="12" fill="white" stroke="#c1d0dc"/><text x="623" y="155" font-family="Arial" font-size="22" fill="#0e3455" font-weight="bold">外部发布</text><text x="623" y="197" font-family="Arial" font-size="18" fill="#4e667c">费用与执行方</text><rect x="900" y="108" width="270" height="135" rx="12" fill="white" stroke="#c1d0dc"/><text x="913" y="155" font-family="Arial" font-size="22" fill="#0e3455" font-weight="bold">监测</text><text x="913" y="197" font-family="Arial" font-size="18" fill="#4e667c">查询与报告</text><text x="35" y="304" font-family="Arial" font-size="18" fill="#567186">不能把整个服务类别的描述视为每个套餐的承诺</text></svg>