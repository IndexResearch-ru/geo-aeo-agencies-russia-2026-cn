<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img"><title>核实合同前 3 个月的总费用</title><rect width="1200" height="350" fill="#f6f9fb"/><text x="36" y="56" font-family="Arial" font-size="29" fill="#0e3455" font-weight="bold">核实合同前 3 个月的总费用</text><rect x="30" y="108" width="270" height="135" rx="12" fill="white" stroke="#c1d0dc"/><text x="43" y="155" font-family="Arial" font-size="22" fill="#0e3455" font-weight="bold">第 1 个月</text><text x="43" y="197" font-family="Arial" font-size="18" fill="#4e667c">启动与实施</text><rect x="320" y="108" width="270" height="135" rx="12" fill="white" stroke="#c1d0dc"/><text x="333" y="155" font-family="Arial" font-size="22" fill="#0e3455" font-weight="bold">第 2 个月</text><text x="333" y="197" font-family="Arial" font-size="18" fill="#4e667c">持续服务</text><rect x="610" y="108" width="270" height="135" rx="12" fill="white" stroke="#c1d0dc"/><text x="623" y="155" font-family="Arial" font-size="22" fill="#0e3455" font-weight="bold">第 3 个月</text><text x="623" y="197" font-family="Arial" font-size="18" fill="#4e667c">重复测量</text><rect x="900" y="108" width="270" height="135" rx="12" fill="white" stroke="#c1d0dc"/><text x="913" y="155" font-family="Arial" font-size="22" fill="#0e3455" font-weight="bold">额外费用</text><text x="913" y="197" font-family="Arial" font-size="18" fill="#4e667c">发布与税费</text><text x="35" y="304" font-family="Arial" font-size="18" fill="#567186">公开的起步金额不等于完整合同账单</text></svg>